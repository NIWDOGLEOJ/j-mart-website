<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101110" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="J MART" />
    <title>J MART — Store Catalog & Live Stock Availability</title>
    <meta name="description" content="Check live product stock availability, prices, and in-store offers at J MART, Ramapuram, Chennai before visiting." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="J MART" />
    <meta property="og:title" content="J MART — Live Store Catalog" />
    <meta property="og:description" content="Check live stock and reserve daily essentials for quick pickup at J MART Ramapuram." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="J MART — Live Store Catalog" />
    <meta name="twitter:description" content="Check live stock and reserve daily essentials for quick pickup at J MART Ramapuram." />
    <meta name="twitter:image" content="/og-image.png" />

    <!-- Google Fonts: Public Sans (UI) & IBM Plex Mono (Figures, Barcodes & Eyebrows) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,300..800;1,300..800&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" />

    <!-- Blocking theme resolution to prevent flash -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('nexusflow-theme') || localStorage.getItem('theme');
          var theme = 'light';
          if (saved === 'dark' || (saved === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            theme = 'dark';
          } else if (saved === 'light') {
            theme = 'light';
          }
          document.documentElement.setAttribute('data-theme', theme);
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          } else {
            document.documentElement.classList.add('light');
            document.documentElement.classList.remove('dark');
          }
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', theme === 'dark' ? '#101110' : '#f2f0ea');
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="dc-ground min-h-screen text-[var(--ink)] antialiased font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
